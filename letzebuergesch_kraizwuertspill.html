<script>
// =============================================================
// WORD DATA
// key = normalized (uppercase, no accents, no spaces) for grid
// ans = correct display answer (with accents/spaces for clues)
// =============================================================
const WORDS = [
  {id:1,  key:"ERWUESSEN",        ans:"erwuessen",        clue:"net méi e Kand (méi wéi 18 Joer al)"},
  {id:2,  key:"VERSUERGEN",       ans:"versuergen",       clue:"op eng Persoun oder Saach oppassen"},

  {id:6,  key:"FEIERDAG",         ans:"Feierdag",         clue:"e speziellen Dag, wou jiddweree Congé huet"},
  {id:7,  key:"MEISPROOCHEGKEET", ans:"Méisproochegkeet", clue:"eng Plaz, wou d'Leit vill Sprooche schwätzen"},
  {id:8,  key:"SPILLSCHOUL",      ans:"Spillschoul",      clue:"eng Schoul fir Kanner vun 4-6 Joer"},
  {id:9,  key:"AUSFLUCH",         ans:"Ausfluch",         clue:"eng Excursioun"},
  {id:10, key:"MATZEN",           ans:"matzen",           clue:"am Zentrum"},
  {id:11, key:"DUERF",            ans:"Duerf",            clue:"eng Uertschaft, wou just +- 1000 Leit liewen"},
  {id:12, key:"ANDEELEN",         ans:"andeelen",         clue:"gruppéieren"},
  {id:13, key:"BETREIEN",         ans:"betreien",         clue:"professionnel op Persounen oppassen"},
  {id:14, key:"BEWEEGUNG",        ans:"Beweegung",        clue:"vill Mouvementer maachen (z.B. Sport)"},
  {id:15, key:"FERDEREN",         ans:"fërderen",         clue:"hëllefen fir ze developpéieren"},
  {id:16, key:"GEDANKEN",         ans:"Gedanken",         clue:"eng Iwwerleeung / e Räsonement"},
  {id:17, key:"REKLAMMEN",        ans:"Reklammen",        clue:"Publicitéit"},
  {id:18, key:"DAGESMAMM",        ans:"Dagesmamm",        clue:"Eng Fra, déi doheem professionnel op Kanner oppasst."},
  {id:19, key:"GEFALT",           ans:"gefält",           clue:"gär hunn / appréciéieren"},
  {id:20, key:"GEWINNEN",         ans:"gewinnen",         clue:"habituer à / getting used to"},
  {id:21, key:"WARSCHEINLECH",    ans:"warscheinlech",    clue:"gewëss (Synonym)"},
  {id:22, key:"BESTEMMT",         ans:"bestëmmt",         clue:"probabel (Synonym)"},
  {id:23, key:"ANDEELUNG",        ans:"Andeelung",        clue:"eng Repartitioun (Synonym)"},
  {id:24, key:"EEGEN",            ans:"eegen",            clue:"hei: intern, net extern"},
  {id:25, key:"ONBEDENGT",        ans:"onbedéngt",        clue:"absolut / definitiv"},
  {id:26, key:"VERSCHIDDEN",      ans:"verschidden",      clue:"ënnerschiddlech (Synonym)"},
  {id:27, key:"ROLLSPILLEN",      ans:"Roll spillen",     clue:"Dat ass e Critère. (eng ___ spillen)"},
  {id:28, key:"WAARDELESCHT",     ans:"Waardelëscht",     clue:"sech fir e Service aschreiwen, mä et muss ee waarden"},
  {id:29, key:"ANESCHT",          ans:"anescht",          clue:"net d'selwecht, verschidden"},
];

// =============================================================
// NORMALIZER — strip accents for comparison
// =============================================================
function norm(str) {
  return str.toUpperCase()
    .replace(/[ÀÁÂÃÄÅ]/g,'A').replace(/[ÈÉÊË]/g,'E')
    .replace(/[ÌÍÎÏ]/g,'I').replace(/[ÒÓÔÕÖ]/g,'O')
    .replace(/[ÙÚÛÜ]/g,'U').replace(/\s+/g,'');
}

// =============================================================
// DISPLAY CHARS (uppercase with accents, no spaces)
// =============================================================
function dispChars(ans) {
  return ans.toUpperCase().replace(/\s+/g,'').split('');
}

// =============================================================
// CROSSWORD PLACEMENT
// =============================================================
function buildCrossword(words, seed) {
  // Sort: longest first, then by seed-based shuffle
  const sorted = [...words].sort((a,b) => {
    if (b.key.length !== a.key.length) return b.key.length - a.key.length;
    return ((a.id * 1373 + seed * 97) % 29) - ((b.id * 1373 + seed * 97) % 29);
  });

  const cells = {}; // "r,c" -> {letter, words:[{id,dir,idx}]}
  const placed = [];

  const K = (r,c) => `${r},${c}`;
  const gc = (r,c) => cells[K(r,c)];

  function bounds() {
    const ks = Object.keys(cells);
    if (!ks.length) return {r0:0,r1:0,c0:0,c1:0};
    let r0=Infinity,r1=-Infinity,c0=Infinity,c1=-Infinity;
    ks.forEach(k => { const [r,c]=k.split(',').map(Number); r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c); });
    return {r0,r1,c0,c1};
  }

  function canPlace(word, row, col, dir) {
    const len = word.key.length;
    const dr = dir==='down'?1:0, dc = dir==='across'?1:0;

    // cell before
    if (gc(row-dr, col-dc)) return false;
    // cell after
    if (gc(row+dr*len, col+dc*len)) return false;

    let inter = 0;
    for (let i=0;i<len;i++) {
      const r=row+dr*i, c=col+dc*i;
      const cell = gc(r,c);
      const letter = word.key[i];
      if (cell) {
        if (cell.letter !== letter) return false;
        const hasPerp = cell.words.some(w => w.dir !== dir);
        if (!hasPerp) return false;
        inter++;
      } else {
        // no parallel adjacency
        if (dir==='across') { if (gc(r-1,c)||gc(r+1,c)) return false; }
        else { if (gc(r,c-1)||gc(r,c+1)) return false; }
      }
    }
    return placed.length===0 || inter>0;
  }

  function place(word, row, col, dir) {
    const dr=dir==='down'?1:0, dc=dir==='across'?1:0;
    for (let i=0;i<word.key.length;i++) {
      const r=row+dr*i, c=col+dc*i, k=K(r,c);
      if (!cells[k]) cells[k]={letter:word.key[i],words:[]};
      cells[k].words.push({id:word.id,dir,idx:i});
    }
    placed.push({...word,row,col,dir});
  }

  function scorePlace(word, row, col, dir) {
    const dr=dir==='down'?1:0, dc=dir==='across'?1:0;
    let inter=0;
    for (let i=0;i<word.key.length;i++) {
      if (gc(row+dr*i,col+dc*i)) inter++;
    }
    const b = bounds();
    const cr=(b.r0+b.r1)/2, cc=(b.c0+b.c1)/2;
    const mr = dir==='down'?row+word.key.length/2:row;
    const mc = dir==='across'?col+word.key.length/2:col;
    const dist = Math.sqrt((mr-cr)**2+(mc-cc)**2);
    return inter*20 - dist*0.3;
  }

  // Place first word
  place(sorted[0], 0, 0, 'across');

  const unplaced = [];
  for (let wi=1;wi<sorted.length;wi++) {
    const word = sorted[wi];
    let best=null, bestScore=-Infinity;

    for (const p of placed) {
      const pdir = p.dir, pdr=pdir==='down'?1:0, pdc=pdir==='across'?1:0;
      for (let pi=0;pi<p.key.length;pi++) {
        for (let wi2=0;wi2<word.key.length;wi2++) {
          if (p.key[pi]!==word.key[wi2]) continue;
          const dir = pdir==='across'?'down':'across';
          const row = pdir==='across' ? p.row-wi2 : p.row+pdr*pi;
          const col = pdir==='across' ? p.col+pdc*pi : p.col-wi2;
          if (!canPlace(word,row,col,dir)) continue;
          const sc = scorePlace(word,row,col,dir);
          if (sc>bestScore) { bestScore=sc; best={row,col,dir}; }
        }
      }
    }

    if (best) place(word, best.row, best.col, best.dir);
    else unplaced.push(word);
  }

  return {cells, placed, unplaced};
}

// Run multiple seeds, pick best
let best = null;
for (let seed=1; seed<=30; seed++) {
  const r = buildCrossword(WORDS, seed);
  if (!best || r.placed.length > best.placed.length) best=r;
  if (best.placed.length === WORDS.length) break;
}

// Normalize coordinates (shift to 0,0)
function normCoords(result) {
  const ks = Object.keys(result.cells);
  let minR=Infinity,minC=Infinity;
  ks.forEach(k=>{const[r,c]=k.split(',').map(Number);minR=Math.min(minR,r);minC=Math.min(minC,c);});
  const newCells={};
  ks.forEach(k=>{
    const[r,c]=k.split(',').map(Number);
    newCells[`${r-minR},${c-minC}`]=result.cells[k];
  });
  result.cells=newCells;
  result.placed.forEach(p=>{p.row-=minR;p.col-=minC;});
  return result;
}
normCoords(best);

// Grid dimensions
function gridDims(cells) {
  let maxR=0,maxC=0;
  Object.keys(cells).forEach(k=>{const[r,c]=k.split(',').map(Number);maxR=Math.max(maxR,r);maxC=Math.max(maxC,c);});
  return {rows:maxR+1,cols:maxC+1};
}

const {rows, cols} = gridDims(best.cells);

// Assign clue numbers
const numberedCells = {}; // "r,c" -> number
let cellNum = 1;
const acrossWords = [], downWords = [];

// Sort placed by row then col for numbering
const sorted = [...best.placed].sort((a,b)=>a.row!==b.row?a.row-b.row:a.col-b.col);
sorted.forEach(p=>{
  const k=`${p.row},${p.col}`;
  if (!numberedCells[k]) numberedCells[k]=cellNum++;
  p.num = numberedCells[k];
  if (p.dir==='across') acrossWords.push(p);
  else downWords.push(p);
});
acrossWords.sort((a,b)=>a.num-b.num);
downWords.sort((a,b)=>a.num-b.num);

// =============================================================
// STATE
// =============================================================
const userInput = {}; // "r,c" -> letter (uppercase)
let selRow=-1,selCol=-1,selDir='across';

function getActiveWord() {
  if (selRow<0) return null;
  const dirWords = selDir==='across'?acrossWords:downWords;
  return dirWords.find(w=>{
    if (selDir==='across') return w.row===selRow && selCol>=w.col && selCol<w.col+w.key.length;
    else return w.col===selCol && selRow>=w.row && selRow<w.row+w.key.length;
  });
}

function getWordAt(r,c,dir) {
  const dw = dir==='across'?acrossWords:downWords;
  return dw.find(w=>{
    if (dir==='across') return w.row===r && c>=w.col && c<w.col+w.key.length;
    else return w.col===c && r>=w.row && r<w.row+w.key.length;
  });
}

// =============================================================
// RENDER GRID
// =============================================================
const container = document.getElementById('grid-container');

function buildGrid() {
  container.innerHTML='';
  for (let r=0;r<rows;r++) {
    const rowDiv=document.createElement('div');
    rowDiv.className='row';
    for (let c=0;c<cols;c++) {
      const cellData=best.cells[`${r},${c}`];
      const div=document.createElement('div');
      div.className='cell '+(cellData?'white':'black');
      div.dataset.r=r; div.dataset.c=c;
      if (cellData) {
        const num = numberedCells[`${r},${c}`];
        if (num) {
          const ns=document.createElement('span');
          ns.className='cell-num';
          ns.textContent=num;
          div.appendChild(ns);
        }
        const ls=document.createElement('span');
        ls.className='cell-letter';
        div.appendChild(ls);
        div.addEventListener('click',()=>onCellClick(r,c));
      }
      rowDiv.appendChild(div);
    }
    container.appendChild(rowDiv);
  }
}

function getCellDiv(r,c) {
  return container.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
}

function updateCellDisplay(r,c) {
  const div=getCellDiv(r,c);
  if (!div||!best.cells[`${r},${c}`]) return;
  const ls=div.querySelector('.cell-letter');
  const inp=userInput[`${r},${c}`]||'';
  if (inp) { ls.textContent=inp; ls.className='cell-letter user'; }
  else { ls.textContent=''; ls.className='cell-letter'; }
}

function highlightWord(activeWord) {
  // Clear all highlights
  document.querySelectorAll('.cell.white').forEach(d=>{
    d.classList.remove('hl-word','hl-sel');
  });
  if (selRow<0) return;
  if (activeWord) {
    const dr=selDir==='down'?1:0, dc=selDir==='across'?1:0;
    for (let i=0;i<activeWord.key.length;i++) {
      const rd=activeWord.row+dr*i, cd=activeWord.col+dc*i;
      const d=getCellDiv(rd,cd);
      if (d) d.classList.add('hl-word');
    }
  }
  const sd=getCellDiv(selRow,selCol);
  if (sd) { sd.classList.remove('hl-word'); sd.classList.add('hl-sel'); }
}

function updateClueBar() {
  const bar=document.getElementById('clue-bar');
  const w=getActiveWord();
  if (!w) { bar.innerHTML='<span style="color:#888;font-size:12px;">Klickt op eng Zell fir unzefänken.</span>'; return; }
  const dirLabel = w.dir==='across'?'→ Horizontal':'↓ Vertikal';
  bar.innerHTML=`<span class="clue-dir">${dirLabel}</span><span class="clue-num">${w.num}.</span><span class="clue-txt">${w.clue}</span>`;
}

function updateClueHighlights() {
  document.querySelectorAll('.clue-row').forEach(d=>d.classList.remove('active'));
  const w=getActiveWord();
  if (!w) return;
  const el=document.querySelector(`.clue-row[data-id="${w.id}"]`);
  if (el) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
}

function updateProgress() {
  const total=Object.keys(best.cells).length;
  const filled=Object.keys(userInput).filter(k=>userInput[k]).length;
  document.getElementById('progress').textContent=`${filled} / ${total}`;
}

// =============================================================
// RENDER CLUES
// =============================================================
function buildClues() {
  const al=document.getElementById('across-list');
  const dl=document.getElementById('down-list');
  al.innerHTML=''; dl.innerHTML='';
  acrossWords.forEach(w=>{
    const div=document.createElement('div');
    div.className='clue-row'; div.dataset.id=w.id;
    div.innerHTML=`<span class="cn">${w.num}</span><span class="ct">${w.clue}</span>`;
    div.addEventListener('click',()=>selectWord(w));
    al.appendChild(div);
  });
  downWords.forEach(w=>{
    const div=document.createElement('div');
    div.className='clue-row'; div.dataset.id=w.id;
    div.innerHTML=`<span class="cn">${w.num}</span><span class="ct">${w.clue}</span>`;
    div.addEventListener('click',()=>selectWord(w));
    dl.appendChild(div);
  });
}

function showUnplaced() {
  if (!best.unplaced.length) return;
  document.getElementById('unplaced-section').style.display='';
  const container=document.getElementById('unplaced-words');
  best.unplaced.forEach(w=>{
    const span=document.createElement('span');
    span.className='unplaced-tag';
    span.textContent=w.ans;
    container.appendChild(span);
  });
}

// =============================================================
// INTERACTION
// =============================================================
function selectWord(w) {
  selRow=w.row; selCol=w.col; selDir=w.dir;
  const aw=getActiveWord();
  highlightWord(aw);
  updateClueBar();
  updateClueHighlights();
}

function onCellClick(r,c) {
  const cellData=best.cells[`${r},${c}`];
  if (!cellData) return;

  if (r===selRow && c===selCol) {
    // Toggle direction
    const otherDir = selDir==='across'?'down':'across';
    const otherWord = getWordAt(r,c,otherDir);
    if (otherWord) { selDir=otherDir; }
  } else {
    selRow=r; selCol=c;
    // Prefer current direction, else try other
    const w=getWordAt(r,c,selDir);
    if (!w) {
      const otherDir=selDir==='across'?'down':'across';
      const ow=getWordAt(r,c,otherDir);
      if (ow) selDir=otherDir;
    }
  }
  const aw=getActiveWord();
  highlightWord(aw);
  updateClueBar();
  updateClueHighlights();
}

function moveSel(dr,dc) {
  const nr=selRow+dr, nc=selCol+dc;
  if (nr>=0&&nr<rows&&nc>=0&&nc<cols&&best.cells[`${nr},${nc}`]) {
    selRow=nr; selCol=nc;
    return true;
  }
  return false;
}

function autoCheckWord(w) {
  if (!w) return;
  const dc=w.dir==='across'?1:0, dr=w.dir==='down'?1:0;
  for (let i=0;i<w.key.length;i++) {
    const r=w.row+dr*i, c=w.col+dc*i;
    const inp=userInput[`${r},${c}`]||'';
    if (!inp || norm(inp)!==w.key[i]) return; // not complete/correct yet
  }
  // All letters correct — mark green and strike clue
  for (let i=0;i<w.key.length;i++) {
    const r=w.row+dr*i, c=w.col+dc*i;
    const d=getCellDiv(r,c);
    if(d) { d.classList.remove('incorrect','revealed'); d.classList.add('correct'); }
  }
  const cl=document.querySelector(`.clue-row[data-id="${w.id}"]`);
  if(cl) cl.classList.add('done');
}

function autoCheckAllWords() {
  best.placed.forEach(w => autoCheckWord(w));
  // Check overall completion
  const allDone = best.placed.every(w => {
    const dc=w.dir==='across'?1:0, dr=w.dir==='down'?1:0;
    for (let i=0;i<w.key.length;i++) {
      const inp=userInput[`${w.row+dr*i},${w.col+dc*i}`]||'';
      if (!inp||norm(inp)!==w.key[i]) return false;
    }
    return true;
  });
  if (allDone) document.getElementById('completion-overlay').classList.add('show');
  updateWordBankUsed();
}

function nextInWord() {
  const w=getActiveWord();
  if (!w) return;
  const dr=selDir==='down'?1:0, dc=selDir==='across'?1:0;
  moveSel(dr,dc);
}

function prevInWord() {
  const w=getActiveWord();
  if (!w) return;
  const dr=selDir==='down'?-1:0, dc=selDir==='across'?-1:0;
  moveSel(dr,dc);
}

// Keyboard handler
document.addEventListener('keydown', e => {
  if (selRow<0) return;

  // Arrow keys
  if (e.key==='ArrowRight') { selDir='across'; if (!moveSel(0,1)) {} highlightWord(getActiveWord()); updateClueBar(); updateClueHighlights(); e.preventDefault(); return; }
  if (e.key==='ArrowLeft')  { selDir='across'; if (!moveSel(0,-1)){} highlightWord(getActiveWord()); updateClueBar(); updateClueHighlights(); e.preventDefault(); return; }
  if (e.key==='ArrowDown')  { selDir='down';   if (!moveSel(1,0)) {} highlightWord(getActiveWord()); updateClueBar(); updateClueHighlights(); e.preventDefault(); return; }
  if (e.key==='ArrowUp')    { selDir='down';   if (!moveSel(-1,0)){} highlightWord(getActiveWord()); updateClueBar(); updateClueHighlights(); e.preventDefault(); return; }

  // Tab: next word
  if (e.key==='Tab') {
    e.preventDefault();
    const allWords = [...acrossWords,...downWords];
    const w=getActiveWord();
    let idx = w ? allWords.indexOf(w) : -1;
    idx = (idx+1)%allWords.length;
    selectWord(allWords[idx]);
    return;
  }

  // Backspace
  if (e.key==='Backspace') {
    e.preventDefault();
    const k=`${selRow},${selCol}`;
    const hadLetter = !!userInput[k];
    if (hadLetter) {
      delete userInput[k];
      updateCellDisplay(selRow,selCol);
      const d=getCellDiv(selRow,selCol);
      if(d) d.classList.remove('correct','incorrect','revealed');
    } else {
      prevInWord();
      const k2=`${selRow},${selCol}`;
      delete userInput[k2];
      updateCellDisplay(selRow,selCol);
      const d=getCellDiv(selRow,selCol);
      if(d) d.classList.remove('correct','incorrect','revealed');
    }
    // un-strike any affected clues
    best.placed.forEach(w=>{
      const dc=w.dir==='across'?1:0,dr=w.dir==='down'?1:0;
      for(let i=0;i<w.key.length;i++){
        if(`${w.row+dr*i},${w.col+dc*i}`===`${selRow},${selCol}`){
          const cl=document.querySelector(`.clue-row[data-id="${w.id}"]`);
          if(cl) cl.classList.remove('done');
        }
      }
    });
    updateProgress();
    highlightWord(getActiveWord());
    return;
  }

  // Delete
  if (e.key==='Delete') {
    const k=`${selRow},${selCol}`;
    delete userInput[k];
    updateCellDisplay(selRow,selCol);
    const d=getCellDiv(selRow,selCol);
    if(d) d.classList.remove('correct','incorrect','revealed');
    updateProgress();
    return;
  }

  // Letter input (including accented characters)
  const char = e.key;
  if (char.length===1 && /[a-zA-ZÀ-ÿ]/u.test(char)) {
    e.preventDefault();
    const k=`${selRow},${selCol}`;
    userInput[k]=char.toUpperCase();
    updateCellDisplay(selRow,selCol);
    const d=getCellDiv(selRow,selCol);
    if(d) d.classList.remove('correct','incorrect','revealed');
    updateProgress();
    autoCheckAllWords();
    nextInWord();
    highlightWord(getActiveWord());
  }
});

// =============================================================
// BUTTONS
// =============================================================
document.getElementById('btn-check').addEventListener('click',()=>{
  let allCorrect=true;
  best.placed.forEach(w=>{
    const dc=w.dir==='across'?1:0, dr=w.dir==='down'?1:0;
    const displayArr=dispChars(w.ans);
    for (let i=0;i<w.key.length;i++) {
      const r=w.row+dr*i, c=w.col+dc*i;
      const k=`${r},${c}`;
      const inp=userInput[k]||'';
      const d=getCellDiv(r,c);
      if (!d) continue;
      d.classList.remove('correct','incorrect','revealed');
      if (!inp) { allCorrect=false; continue; }
      if (norm(inp)===w.key[i]) d.classList.add('correct');
      else { d.classList.add('incorrect'); allCorrect=false; }
    }
  });
  if (allCorrect) document.getElementById('completion-overlay').classList.add('show');
});

document.getElementById('btn-reveal').addEventListener('click',()=>{
  best.placed.forEach(w=>{
    const dc=w.dir==='across'?1:0, dr=w.dir==='down'?1:0;
    const displayArr=dispChars(w.ans);
    for (let i=0;i<w.key.length;i++) {
      const r=w.row+dr*i, c=w.col+dc*i;
      const k=`${r},${c}`;
      userInput[k]=displayArr[i];
      updateCellDisplay(r,c);
      const d=getCellDiv(r,c);
      if(d) { d.classList.remove('correct','incorrect'); d.classList.add('revealed'); }
    }
  });
  updateProgress();
});

document.getElementById('btn-reset').addEventListener('click',()=>{
  Object.keys(userInput).forEach(k=>delete userInput[k]);
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) {
    updateCellDisplay(r,c);
    const d=getCellDiv(r,c);
    if(d) d.classList.remove('correct','incorrect','revealed');
  }
  document.querySelectorAll('.clue-row.done').forEach(el=>el.classList.remove('done'));
  document.querySelectorAll('.wordbank-tag.used').forEach(el=>el.classList.remove('used'));
  updateProgress();
});

// =============================================================
// WORD BANK
// =============================================================
function buildWordBank() {
  const container = document.getElementById('wordbank-words');
  const allWords = [...WORDS].sort((a,b) => a.ans.localeCompare(b.ans));
  allWords.forEach(w => {
    const span = document.createElement('span');
    span.className = 'wordbank-tag';
    span.textContent = w.ans;
    span.dataset.wid = w.id;
    container.appendChild(span);
  });
}

function updateWordBankUsed() {
  document.querySelectorAll('.wordbank-tag').forEach(tag => {
    const w = best.placed.find(p => p.id === +tag.dataset.wid);
    if (!w) return;
    const dc=w.dir==='across'?1:0, dr=w.dir==='down'?1:0;
    const complete = w.key.split('').every((ch,i) => norm(userInput[`${w.row+dr*i},${w.col+dc*i}`]||'') === ch);
    tag.classList.toggle('used', complete);
  });
}

document.getElementById('btn-eye').addEventListener('click', () => {
  const words = document.getElementById('wordbank-words');
  const btn = document.getElementById('btn-eye');
  const hidden = words.classList.toggle('hidden');
  btn.classList.toggle('active', !hidden);
});

buildWordBank();

// Patch autoCheckAllWords to also update word bank
const _origAutoCheck = autoCheckAllWords;
// =============================================================
// INIT
// =============================================================
buildGrid();
buildClues();
showUnplaced();
updateProgress();
</script>
